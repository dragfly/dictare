name: "0 - release: publish"

on:
  workflow_dispatch:

jobs:
  # ── Gate: extract version, detect pre-release, check duplicates ──
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version and detect pre-release
        id: version
        run: |
          VERSION=$(grep -E '^__version__' src/dictare/__init__.py | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # PEP 440: stable = digits and dots only (e.g. 1.2.3)
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pre-release version ${VERSION} — will publish to PyPI only (no tag or GitHub Release)"
          fi

      - name: Check if already released on PyPI
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if curl -sf "https://pypi.org/pypi/dictare/${VERSION}/json" > /dev/null 2>&1; then
            echo "::error::Version ${VERSION} already exists on PyPI"
            exit 1
          fi

  # ── PyPI: always (stable + pre-release) ──
  publish:
    name: Publish to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publisher (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release: stable only ──
  github-release:
    name: Create GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -n "/^## \[${VERSION}\]/,/^## \[/{/^## \[${VERSION}\]/d;/^## \[/d;p}" CHANGELOG.md > /tmp/release-notes.md

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md

  # ── Homebrew tap: stable only ──
  update-tap:
    name: Update Homebrew tap
    needs: [prepare, publish]
    if: needs.prepare.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load tap token from Infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
          # Least privilege: fetch only the single secret this job needs.
          TOKEN=$(infisical secrets get TAP_GITHUB_TOKEN \
            --domain "https://eu.infisical.com" \
            --projectId "7d6c2573-e67b-4243-9911-0a9ddaed58b8" \
            --path "/work/dictare/app/ci" \
            --env prod \
            --plain)
          echo "::add-mask::$TOKEN"
          echo "TAP_GITHUB_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Wait for PyPI to index the package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/dictare/${VERSION}/json" > /dev/null 2>&1; then
              echo "Package available on PyPI"
              exit 0
            fi
            echo "Waiting for PyPI to index ${VERSION}... (attempt $i/30)"
            sleep 10
          done
          echo "::error::Package ${VERSION} was not indexed on PyPI in time"
          exit 1

      - name: Get PyPI source URL and SHA256
        id: pypi
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          JSON=$(curl -sf "https://pypi.org/pypi/dictare/${VERSION}/json")
          URL=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); s=[u for u in d['urls'] if u.get('packagetype') == 'sdist']; print(s[0]['url'])")
          SHA=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); s=[u for u in d['urls'] if u.get('packagetype') == 'sdist']; print(s[0]['digests']['sha256'])")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Get launcher SHA256
        id: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "launcher" \
            --pattern "Dictare-launcher-universal.zip" \
            --output /tmp/Dictare-launcher-universal.zip
          SHA=$(sha256sum /tmp/Dictare-launcher-universal.zip | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: dragfly/homebrew-tap
          token: ${{ env.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Write formula from bootstrap template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          template = Path("packaging/homebrew/dictare.rb").read_text()
          replacements = {
              "PLACEHOLDER_VERSION": os.environ["VERSION"],
              "PLACEHOLDER_PYPI_URL": os.environ["PYPI_URL"],
              "PLACEHOLDER_PYPI_SHA256": os.environ["PYPI_SHA256"],
              "PLACEHOLDER_LAUNCHER_SHA256": os.environ["LAUNCHER_SHA256"],
          }
          for old, new in replacements.items():
              template = template.replace(old, new)
          Path("homebrew-tap/Formula/dictare.rb").write_text(template)
          PY
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PYPI_URL: ${{ steps.pypi.outputs.url }}
          PYPI_SHA256: ${{ steps.pypi.outputs.sha256 }}
          LAUNCHER_SHA256: ${{ steps.launcher.outputs.sha256 }}

      - name: Validate formula syntax
        run: ruby -c homebrew-tap/Formula/dictare.rb

      - name: Push tap update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dictare.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "chore: bump dictare to ${{ needs.prepare.outputs.version }}"
          git push
