name: "auto: test macOS + mlx"

# Real coverage for the Apple Silicon `mlx` optional-extra. The other CI jobs
# install only `.[dev]` and never exercise mlx/torch/numpy-pinned code, so a
# green check there says nothing about the mlx path. This job installs
# `.[dev,mlx]` on an arm64 runner and actually loads + runs the stack.
#
# Gated to dependency changes (where bumps land) + main + manual, so it does
# not run on every push.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-macos-mlx.yml"
      - "tests/test_mlx_smoke.py"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-macos-mlx.yml"
      - "tests/test_mlx_smoke.py"
  workflow_dispatch:

jobs:
  test-macos-mlx:
    runs-on: macos-latest  # Apple Silicon (arm64); free for public repos
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python and install with the mlx extra
        run: |
          uv venv --python 3.11 --seed .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install -e ".[dev,mlx]"

      - name: Smoke-import the mlx stack (catches ABI breaks)
        run: |
          .venv/bin/python - <<'PY'
          import numpy, scipy, numba, torch
          import mlx.core, mlx_whisper, mlx_audio, mlx_lm
          print("mlx stack OK — numpy", numpy.__version__, "torch", torch.__version__)
          PY

      - name: Cache Whisper model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-tiny-v1

      - name: Run mlx smoke tests (real whisper-tiny transcription)
        run: .venv/bin/pytest tests/ -v -m mlx
