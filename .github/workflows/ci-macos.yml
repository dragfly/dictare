name: "auto: test macOS"

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"  # daily at 04:00 UTC (catches environment drift)
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: ci-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python and install deps
        run: |
          uv venv --python 3.11 --seed .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/pip install -e ".[dev]"

      - name: Run full test suite on macOS (incl. CoreAudio, excl. mlx/gpu extras)
        run: pytest tests/ -v -m 'not mlx and not gpu'
